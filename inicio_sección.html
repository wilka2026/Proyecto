<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="inicio_sección.css">
</head>
<body>

    <main class="contenedor-login">
        <header class="login-header">
            <h1>Bienvenido</h1>
            <p>Ingresa tus credenciales para acceder</p>
        </header>

        <form class="login-form" action="#" method="POST">
            
            <div class="grupo-input">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="grupo-input">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
            </div>

            <div class="opciones-formulario">
                <label class="recordarme">
                    <input type="checkbox" name="remember"> Recordarme
                </label>
                <a href="#" class="olvido-pass">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-enviar">Iniciar Sesión</button>
            
        </form>

        <footer class="login-footer">
            <p>¿No tienes una cuenta? <a href="#">Regístrate aquí</a></p>
        </footer>
    </main>

</body>
</html>
